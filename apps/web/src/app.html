<!doctype html>
<html lang="en" %theme%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="application-name" content="CouplesCash" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="CouplesCash" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdf8f3" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c2130" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="min-h-dvh bg-base-200 text-base-content antialiased"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
