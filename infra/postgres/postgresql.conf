# PostgreSQL 16 configuration tuned for CouplesCash on a Raspberry Pi 4.
#
# Mounted read-only at /etc/postgresql/postgresql.conf and selected with
# `postgres -c config_file=...` in compose.yml. The container has a 256 MB
# memory limit; the numbers below keep Postgres well inside it while leaving
# room for the OS page cache. Only two users ever talk to this database.

# --- Connections ------------------------------------------------------------
# '*' is fine: the container is only reachable on the internal compose
# network (and on 127.0.0.1:5432 of the host with compose.dev.yml).
listen_addresses = '*'
port = 5432
max_connections = 40                 # api pool (≤ ~20) + migrations + psql/backups
password_encryption = scram-sha-256

# --- Memory -----------------------------------------------------------------
shared_buffers = 64MB                # ~25% of the 256 MB container limit
effective_cache_size = 512MB         # what the planner may assume the OS caches
work_mem = 4MB                       # per sort/hash; queries here are tiny
maintenance_work_mem = 32MB
temp_buffers = 8MB
huge_pages = off
dynamic_shared_memory_type = posix
jit = off                            # JIT costs RAM and start-up time for no gain on small queries

# --- WAL / checkpoints -----------------------------------------------------
wal_compression = on                 # fewer bytes written → kinder to SD cards / SSDs
wal_level = replica
synchronous_commit = on              # keep durability; this is money data
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --- Planner / storage ------------------------------------------------------
# Defaults assume spinning disks. SD cards and SSDs have no seek penalty.
random_page_cost = 1.1
effective_io_concurrency = 2         # raise to ~100 if PGDATA lives on an SSD

# --- Autovacuum ------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min

# --- Logging (goes to stderr → `docker compose logs db`) -------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500     # log anything slower than 500 ms
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'

# --- Locale / time ----------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
